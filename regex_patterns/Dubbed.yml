name: Dubbed
pattern: ^(?!.*(Dual|Multi)[-_. ]?Audio).*((?<!multi-)\b(dub(bed)?)\b|(funi|eng(lish)?)_?dub)
description: "Matches the release group `Dubbed` only if it is:\n\n  - Preceded by\
  \ the start of the string (`^`), a whitespace character (`\\s`), a period (`.`),\
  \ or a hyphen (`-`).\n\n  - Followed by a word boundary (`\\b`), ensuring it ends\
  \ cleanly without being part of a longer word."
tags:
- Release Group
tests: []
