name: Not Single Language Only
pattern: \[(JA|ZH|KO)\]
description: "Matches the release group `Not Single Language Only` only if it is:\n\
  \n  - Preceded by the start of the string (`^`), a whitespace character (`\\s`),\
  \ a period (`.`), or a hyphen (`-`).\n\n  - Followed by a word boundary (`\\b`),\
  \ ensuring it ends cleanly without being part of a longer word."
